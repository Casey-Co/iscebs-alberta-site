# Publishes Website Settings and a saved copy of the board from Wix each night.
name: Sync website from Wix

on:
  schedule:
    - cron: '17 8 * * *' # daily, about 2:17 a.m. Edmonton (1:17 a.m. in winter)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-board
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # Always start from the latest site, even when an old run is re-run.
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Copy Website Settings from Wix
        id: settings
        run: node scripts/sync-settings.mjs

      - name: Copy board from Wix
        if: ${{ !cancelled() }}
        id: board
        run: node scripts/sync-board.mjs

      # GitHub pauses scheduled jobs after 60 days with no activity in the repository.
      # A one-line note on the 1st of each month keeps this job running when the board
      # hasn't changed for a while.
      - name: Monthly keep-alive
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ]; then date -u +%F > .github/last-board-check; fi

      - name: Save changes
        if: ${{ !cancelled() && (steps.settings.outcome == 'success' || steps.board.outcome == 'success') }}
        id: save
        run: |
          git add -A -- '*.html' assets/wix-config.js assets/board .github/last-board-check
          if git diff --cached --quiet; then echo "Website content unchanged."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Website: sync content from Wix"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Request GitHub Pages build
        if: ${{ !cancelled() && steps.save.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built=$(gh api "repos/$GITHUB_REPOSITORY/pages/builds/latest" --jq 'select(.status == "built") | .commit')
          if [ "$built" != "$(git rev-parse HEAD)" ]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent
          fi
